[project]
name = "aeat_module"
authors = [
    { name = "soporte@jfa.name", email = "soporte@jfa.name"}
]
description = "Módulo para la AEAT"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "frappe>=16.0.0,<17.0.0",
    "qrcode[pil]>=7.4",
    "zeep>=4.2",
    "lxml",
    "signxml>=4.0",
    # Declaradas explícitamente porque frappe las trae como dependencias git
    # (URL dependency); uv exige que las URL dependencies transitivas se
    # declaren también como requisito/constraint directo del proyecto que
    # se instala, si no falla con "must be expressed as direct requirements
    # or constraints" al hacer `bench get-app`/`uv pip install -e`.
    "PyPika @ git+https://github.com/frappe/pypika@2c50e6142b2d61d2d243e466fdd5dc03b3d918f2",
    "gunicorn @ git+https://github.com/frappe/gunicorn@54b59ca884c79dcf04d4882658a32bbaf17e999f",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
