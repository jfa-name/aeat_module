[project]
name = "aeat_module"
authors = [
    { name = "soporte@jfa.name", email = "soporte@jfa.name"}
]
description = "Módulo para la AEAT"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "frappe>=16.0.0,<17.0.0",
    "qrcode[pil]>=7.4",
    "zeep>=4.2",
    "lxml",
    "signxml>=4.0"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
